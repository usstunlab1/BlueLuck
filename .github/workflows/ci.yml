name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: List repository files
        run: |
          echo "Workspace: $(pwd)"
          ls -la
          ls -la BlueLuck || true

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Dotnet info
        run: dotnet --info

      - name: Restore (diagnostic)
        run: dotnet restore BlueLuck.csproj -v diag || true

      - name: Build (diagnostic)
        run: |
          dotnet build BlueLuck.csproj --configuration Release --no-restore -v diag > build_output.txt 2>&1 || true

      - name: Upload build log
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.txt

      - name: Test (if present)
        run: |
          dotnet test --no-build --verbosity normal > test_output.txt 2>&1 || true

      - name: Upload test log
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: test_output.txt
