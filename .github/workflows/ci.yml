name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create early debug files
        run: |
          echo "RUNNER_OS=${{ runner.os }}" > debug-info.txt
          echo "GITHUB_RUN_ID=${{ github.run_id }}" >> debug-info.txt
          echo "GITHUB_SHA=${{ github.sha }}" >> debug-info.txt
          echo "GITHUB_REF=${{ github.ref }}" >> debug-info.txt
          echo "Workspace listing:" > debug-ls.txt
          ls -la >> debug-ls.txt || true

      - name: Upload early debug artifact (verify artifact service)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: early-debug
          path: |
            debug-info.txt
            debug-ls.txt

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '6.0.x'

      - name: Dotnet info
        run: dotnet --info

      - name: Restore
        run: dotnet restore BlueLuck.csproj

      - name: Build
        run: |
          dotnet build BlueLuck.csproj --configuration Release --no-restore -v minimal || true

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bin/Release/net6.0/*.dll

      - name: Test (if present)
        run: dotnet test --no-build --verbosity normal || true

      - name: Upload test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-log
          path: |
            **/TestResults/**/*.trx
            test_output.txt
